name: Clean remaining CI warnings

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply warning cleanup
        shell: bash
        run: |
          python3 .github/scripts/cleanup-ci-warnings.py
          bun install --frozen-lockfile
          bunx biome format --write \
            packages/browser-runtime/src/browser-service.ts \
            packages/browser-runtime/src/selection-channel.ts \
            packages/desktop/src/main/main.ts \
            packages/desktop/src/main/workspace-host.ts \
            packages/desktop/test/workspace-host-browser-navigation.test.ts \
            packages/desktop/test/workspace-host-reconnect.test.ts
          set -o pipefail
          bun run ci:check:full 2>&1 | tee /tmp/ci-check.log
          if grep -Eq 'Found [1-9][0-9]* warnings?' /tmp/ci-check.log; then
            echo "CI check still reports warnings"
            exit 1
          fi
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p packages/natives/native
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
          bun --cwd=packages/browser-runtime run test
          (cd packages/desktop && bunx --bun vitest run)
      - name: Publish cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/browser-runtime/src/browser-service.ts \
            packages/browser-runtime/src/selection-channel.ts \
            packages/desktop/src/main/main.ts \
            packages/desktop/src/main/workspace-host.ts \
            packages/desktop/test/workspace-host-browser-navigation.test.ts \
            packages/desktop/test/workspace-host-reconnect.test.ts
          git commit -m "chore: remove remaining CI warnings"
          git push origin HEAD:feat/omp-chat-workspace
