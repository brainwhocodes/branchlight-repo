name: Address PR review comments

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply renderer review fixes
        id: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if new in source:
                  return source
              if old not in source:
                  raise SystemExit(f"Could not find expected {label} block")
              return source.replace(old, new, 1)

          app_path = Path("packages/desktop/src/renderer/App.svelte")
          app = app_path.read_text()
          app = replace_once(
              app,
              "\t\tgrid-template-rows: 34px 46px minmax(0, 1fr);",
              "\t\tgrid-template-columns: minmax(0, 1fr);\n\t\tgrid-template-rows: 34px 46px minmax(0, 1fr);",
              "workspace grid",
          )
          app_path.write_text(app)

          chat_path = Path("packages/desktop/src/renderer/OmpChat.svelte")
          chat = chat_path.read_text()
          chat = replace_once(
              chat,
              '  let activeId = "";',
              '  let activeId = "";\n  let sessionSelectionToken = 0;',
              "session selection token",
          )
          chat = replace_once(
              chat,
              "  let subagentLoading = false;",
              "  let subagentLoading = false;\n  let subagentRequestToken = 0;",
              "subagent request token",
          )

          old_select_session = '''  async function selectSession(id: string): Promise<void> {
    resetFileDiff();
    resetOpenRouterModelState();
    openReasoning = new Set();
    activeId = id;
    errorMessage = "";
    try {
      current = await window.branchlight.openSession(id);
      availableCommands = current.commands ?? [];
      commandError = "";
      availableModels = [];
      if (bootstrap) bootstrap = { ...bootstrap, registry: { ...bootstrap.registry, activeByKind: { ...bootstrap.registry.activeByKind, [kind]: id } } };
      await tick();
      await scrollTimelineToEnd(true, id);
    } catch (error) { showError(error); }
  }'''
          new_select_session = '''  async function selectSession(id: string): Promise<void> {
    const requestToken = ++sessionSelectionToken;
    const requestedKind = kind;
    resetFileDiff();
    resetOpenRouterModelState();
    if (current?.record.id !== id) resetSubagentSelection();
    openReasoning = new Set();
    activeId = id;
    errorMessage = "";
    try {
      const snapshot = await window.branchlight.openSession(id);
      if (requestToken !== sessionSelectionToken || activeId !== id || kind !== requestedKind) return;
      current = snapshot;
      availableCommands = snapshot.commands ?? [];
      commandError = "";
      availableModels = [];
      if (bootstrap) bootstrap = { ...bootstrap, registry: { ...bootstrap.registry, activeByKind: { ...bootstrap.registry.activeByKind, [requestedKind]: id } } };
      await tick();
      if (requestToken !== sessionSelectionToken || activeId !== id || kind !== requestedKind) return;
      await scrollTimelineToEnd(true, id);
    } catch (error) {
      if (requestToken !== sessionSelectionToken || activeId !== id || kind !== requestedKind) return;
      activeId = current?.record.id ?? "";
      showError(error);
    }
  }'''
          chat = replace_once(chat, old_select_session, new_select_session, "session selection")

          old_select_kind = '''  async function selectKind(next: SessionKind): Promise<void> {
    kind = next;
    resetFileDiff();
    selectedSubagent = "";
    subagentTranscript = "";
    const id = bootstrap?.registry.activeByKind[next] ?? bootstrap?.registry.sessions.find(session => session.kind === next)?.id;
    if (id) {
      await selectSession(id);
      loading = false;
    } else {
      activeId = "";
      current = undefined;
      loading = false;
      availableCommands = [];
      availableModels = [];
      resetOpenRouterModelState();
    }
  }'''
          new_select_kind = '''  async function selectKind(next: SessionKind): Promise<void> {
    kind = next;
    resetFileDiff();
    resetSubagentSelection();
    const id = bootstrap?.registry.activeByKind[next] ?? bootstrap?.registry.sessions.find(session => session.kind === next)?.id;
    if (id) {
      await selectSession(id);
      loading = false;
    } else {
      sessionSelectionToken += 1;
      activeId = "";
      current = undefined;
      loading = false;
      availableCommands = [];
      availableModels = [];
      resetOpenRouterModelState();
    }
  }'''
          chat = replace_once(chat, old_select_kind, new_select_kind, "session kind selection")

          old_subagent = '''

  async function inspectSubagent(agent: SubagentView): Promise<void> {
    if (!current) return;
    selectedSubagent = agent.id;
    subagentLoading = true;
    try {
      const result = await window.branchlight.getSubagentMessages(current.record.id, agent.id, subagentByte);
      const value = result as { nextByte?: number; reset?: boolean; messages?: unknown[] };
      if (value.reset) { subagentByte = 0; subagentTranscript = ""; }
      if (Array.isArray(value.messages)) subagentTranscript += value.messages.map(message => formatMessage(message)).join("\\n\\n");
      if (typeof value.nextByte === "number") subagentByte = value.nextByte;
    } catch (error) { showError(error); }
    finally { subagentLoading = false; }
  }'''
          new_subagent = '''

  function resetSubagentSelection(): void {
    subagentRequestToken += 1;
    selectedSubagent = "";
    subagentTranscript = "";
    subagentByte = 0;
    subagentLoading = false;
  }

  async function inspectSubagent(agent: SubagentView): Promise<void> {
    if (!current) return;
    const sessionId = current.record.id;
    const agentId = agent.id;
    if (selectedSubagent !== agentId) {
      selectedSubagent = agentId;
      subagentTranscript = "";
      subagentByte = 0;
    }
    const requestToken = ++subagentRequestToken;
    const fromByte = subagentByte;
    subagentLoading = true;
    try {
      const result = await window.branchlight.getSubagentMessages(sessionId, agentId, fromByte);
      if (requestToken !== subagentRequestToken || current?.record.id !== sessionId || selectedSubagent !== agentId) return;
      const value = result as { nextByte?: number; reset?: boolean; messages?: unknown[] };
      if (value.reset) {
        subagentByte = 0;
        subagentTranscript = "";
      }
      if (Array.isArray(value.messages)) {
        const chunk = value.messages.map(message => formatMessage(message)).join("\\n\\n");
        if (chunk) subagentTranscript = subagentTranscript ? `${subagentTranscript}\\n\\n${chunk}` : chunk;
      }
      if (typeof value.nextByte === "number") subagentByte = value.nextByte;
    } catch (error) {
      if (requestToken === subagentRequestToken && current?.record.id === sessionId && selectedSubagent === agentId) showError(error);
    } finally {
      if (requestToken === subagentRequestToken && current?.record.id === sessionId && selectedSubagent === agentId) subagentLoading = false;
    }
  }'''
          chat = replace_once(chat, old_subagent, new_subagent, "subagent transcript")
          chat_path.write_text(chat)
          PY

          if git diff --quiet -- packages/desktop/src/renderer/App.svelte packages/desktop/src/renderer/OmpChat.svelte; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.patch.outputs.changed == 'true'
        uses: ./.github/actions/setup-system-deps

      - name: Install dependencies
        if: steps.patch.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Install release native addons
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$tmp"
          mkdir -p packages/natives/native
          cp "$tmp/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$tmp/package/pi_natives.linux-x64-modern.node" packages/natives/native/

      - name: Check formatting and types
        if: steps.patch.outputs.changed == 'true'
        run: bun --cwd=packages/desktop run check

      - name: Test desktop package
        if: steps.patch.outputs.changed == 'true'
        run: cd packages/desktop && bunx --bun vitest run

      - name: Build OMP desktop backend
        if: steps.patch.outputs.changed == 'true'
        run: bun --cwd=packages/desktop run backend:build

      - name: Publish review fixes
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/src/renderer/App.svelte packages/desktop/src/renderer/OmpChat.svelte
          git commit -m "fix(desktop): address OMP chat review feedback"
          git push origin HEAD:feat/omp-chat-workspace
