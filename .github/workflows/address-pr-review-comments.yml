name: Address PR review comments

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply renderer review fixes
        id: patch
        shell: bash
        env:
          PATCH_SCRIPT_B64: ""
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > "$RUNNER_TEMP/address-review-comments.py"
          python3 "$RUNNER_TEMP/address-review-comments.py"
          if git diff --quiet -- packages/desktop/src/renderer/App.svelte packages/desktop/src/renderer/OmpChat.svelte; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.patch.outputs.changed == 'true'
        uses: ./.github/actions/setup-system-deps

      - name: Install dependencies
        if: steps.patch.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Install release native addons
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$tmp"
          mkdir -p packages/natives/native
          cp "$tmp/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$tmp/package/pi_natives.linux-x64-modern.node" packages/natives/native/

      - name: Check formatting and types
        if: steps.patch.outputs.changed == 'true'
        run: bun --cwd=packages/desktop run check

      - name: Test desktop package
        if: steps.patch.outputs.changed == 'true'
        run: cd packages/desktop && bunx --bun vitest run

      - name: Build OMP desktop backend
        if: steps.patch.outputs.changed == 'true'
        run: bun --cwd=packages/desktop run backend:build

      - name: Publish review fixes
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/src/renderer/App.svelte packages/desktop/src/renderer/OmpChat.svelte
          git commit -m "fix(desktop): address OMP chat review feedback"
          git push origin HEAD:feat/omp-chat-workspace
