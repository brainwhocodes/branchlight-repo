name: Verify OMP chat workspace

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Polish, test, and publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/desktop/src/renderer/App.svelte")
          source = path.read_text()
          source = source.replace(
              '<nav class="workspace-tabs" aria-label="Workspace tabs">',
              '<nav class="workspace-tabs" role="tablist" aria-label="Workspace tabs">',
          )
          source = source.replace(
              '\t\t\t\tclass:is-active={activeTabId === CHAT_TAB_ID}\n\t\t\t\taria-selected={activeTabId === CHAT_TAB_ID}',
              '\t\t\t\tclass:is-active={activeTabId === CHAT_TAB_ID}\n\t\t\t\trole="tab"\n\t\t\t\taria-selected={activeTabId === CHAT_TAB_ID}',
          )
          source = source.replace(
              '<div class="browser-pane" class:is-focused={tab.activePaneId === pane.id} onpointerdown={() => activatePane(tab, pane.id)}>',
              '<div class="browser-pane" class:is-focused={tab.activePaneId === pane.id} role="group" aria-label="Browser pane" onpointerdown={() => activatePane(tab, pane.id)}>',
          )
          path.write_text(source)
          PY

          bun install --frozen-lockfile
          bun --cwd packages/desktop run check
          bun --cwd packages/desktop run test

          rm .github/workflows/omp-chat-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/src/renderer/App.svelte .github/workflows/omp-chat-verify.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(desktop): polish OMP chat workspace shell"
            git push origin HEAD:feat/omp-chat-workspace
          fi
