name: Apply CI compatibility fixes

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Patch, validate, and publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/scripts/apply-ci-fixes.py")
          path.write_text(path.read_text().replace("\\t", "\t"))
          PY
          python3 .github/scripts/apply-ci-fixes.py
          python3 .github/scripts/apply-changelog-ci-fix.py

          bun install --frozen-lockfile
          bunx biome format --write \
            packages/utils/src/local-runtime.ts \
            packages/coding-agent/src/cli.ts \
            packages/coding-agent/src/tools/computer/worker-entry.ts \
            packages/coding-agent/test/export-html-template.test.ts \
            packages/coding-agent/test/utils/changelog.test.ts

          bun --cwd=packages/utils run check

          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p packages/natives/native
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/

          (cd packages/utils && bun test test/local-runtime.test.ts --timeout=30000)
          (cd packages/coding-agent && bun test \
            test/acp-stdout-hygiene.test.ts \
            test/cli-computer-lazy.test.ts \
            test/eval/process-entry-import.test.ts \
            test/export-html-template.test.ts \
            test/launch/broker-list-order.test.ts \
            test/launch/broker-restarting-settle.test.ts \
            test/main-initial-message-title.test.ts \
            test/tools/browser-relay-daemon.test.ts \
            test/tools/launch-eisdir-fallback.test.ts \
            test/tools/launch.test.ts \
            test/utils/changelog.test.ts \
            --parallel=1 --timeout=30000)
          bun --cwd=packages/desktop run check
          bun --cwd=packages/desktop run backend:build

          rm .github/workflows/ci-fix-process-identity.yml
          rm .github/scripts/apply-ci-fixes.py
          rm .github/scripts/apply-changelog-ci-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/utils/src/local-runtime.ts \
            packages/coding-agent/src/cli.ts \
            packages/coding-agent/src/tools/computer/worker-entry.ts \
            packages/coding-agent/test/export-html-template.test.ts \
            packages/coding-agent/test/utils/changelog.test.ts \
            .github/workflows/ci-fix-process-identity.yml \
            .github/scripts/apply-ci-fixes.py \
            .github/scripts/apply-changelog-ci-fix.py
          git commit -m "fix: restore portable process identity and lazy CLI startup"
          git push origin HEAD:feat/omp-chat-workspace
