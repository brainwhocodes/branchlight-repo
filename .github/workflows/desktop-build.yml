name: Mars Kommander desktop builds

on:
   pull_request:
      branches: [main]
      paths:
         - "packages/desktop/**"
         - "packages/coding-agent/**"
         - "packages/natives/**"
         - "crates/pi-natives/**"
         - "scripts/**"
         - "package.json"
         - "bun.lock"
         - ".github/actions/bazel-cache/**"
         - ".github/actions/bazel-natives/**"
         - ".github/actions/bun-install/**"
         - ".github/workflows/desktop-build.yml"
   push:
      branches: [main]
      tags: ["v*"]
      paths:
         - "packages/desktop/**"
         - "packages/coding-agent/**"
         - "packages/natives/**"
         - "crates/pi-natives/**"
         - "scripts/**"
         - "package.json"
         - "bun.lock"
         - ".github/actions/bazel-cache/**"
         - ".github/actions/bazel-natives/**"
         - ".github/actions/bun-install/**"
         - ".github/workflows/desktop-build.yml"
   workflow_dispatch:

concurrency:
   group: "mars-kommander-desktop-${{ github.ref }}"
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
   contents: read

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   windows_native:
      name: Build Windows baseline native addon
      runs-on: ubuntu-22.04
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.14
         - run: bun install --frozen-lockfile
         - uses: ./.github/actions/bazel-natives
           with:
              targets: win32-x64-baseline
              dest: desktop-native
              cache-scope: mars-kommander-win32-x64
         - name: Upload Windows native addon
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: mars-kommander-win32-native
              path: desktop-native/pi_natives.win32-x64-baseline.node
              if-no-files-found: error
              retention-days: 1

   macos:
      name: Build macOS ${{ matrix.arch }}
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 90
      strategy:
         fail-fast: false
         matrix:
            include:
               - runner: macos-14
                 arch: arm64
                 native_target: darwin-arm64
               - runner: macos-15-intel
                 arch: x64
                 native_target: darwin-x64-baseline
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.14
         - run: bun install --frozen-lockfile
         - uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_target }}
              cache-scope: mars-kommander-${{ matrix.arch }}
         - name: Build contained app
           env:
              MARS_DESKTOP_ARCH: ${{ matrix.arch }}
           run: bun --cwd=packages/desktop run make:contained
         - name: Exercise packaged Electron shell
           run: bun --cwd=packages/desktop run test:e2e:packaged
         - name: Upload macOS app
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: mars-kommander-macos-${{ matrix.arch }}
              path: packages/desktop/dist/*
              if-no-files-found: error
              retention-days: 14

   windows:
      name: Build Windows 10/11 x64
      needs: [windows_native]
      runs-on: windows-2025
      timeout-minutes: 75
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.14
         - name: Install dependencies
           shell: pwsh
           run: bun install --frozen-lockfile
         - name: Download Windows native addon
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: mars-kommander-win32-native
              path: packages/natives/native
         - name: Build contained app
           shell: pwsh
           env:
              MARS_DESKTOP_ARCH: x64
           run: bun --cwd=packages/desktop run make:contained
         - name: Exercise packaged Electron shell
           shell: pwsh
           run: bun --cwd=packages/desktop run test:e2e:packaged
         - name: Upload Windows 10/11 app
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: mars-kommander-windows-10-11-x64
              path: packages/desktop/dist/*
              if-no-files-found: error
              retention-days: 14
