name: Validate final CI repairs

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply, validate, and publish
        shell: bash
        run: |
          python3 .github/scripts/apply-ci-round2.py
          python3 .github/scripts/apply-ci-runtime-entry-fix.py

          bun install --frozen-lockfile
          bunx biome format --write \
            packages/coding-agent/src/modes/rpc/rpc-client.ts \
            packages/coding-agent/src/desktop-terminal/runtime-server-entry.ts \
            packages/workspace-runtime/src/bootstrap.ts \
            scripts/ci-release-publish.ts \
            packages/browser-runtime/tsconfig.publish.json \
            packages/workspace-runtime/tsconfig.publish.json
          bash -n scripts/install-tests/run-ci.sh

          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p packages/natives/native
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/

          bun run ci:check:full
          (cd packages/coding-agent && bun test test/rpc-client.restart.test.ts --parallel=1 --timeout=30000)
          OMP_INSTALL_TEST_SKIP_NATIVE_BUILD=1 bun run ci:test:install-methods

          rm .github/workflows/ci-fix-round2.yml
          rm .github/scripts/apply-ci-round2.py
          rm .github/scripts/apply-ci-runtime-entry-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/coding-agent/src/modes/rpc/rpc-client.ts \
            packages/coding-agent/src/desktop-terminal/runtime-server-entry.ts \
            packages/workspace-runtime/src/bootstrap.ts \
            scripts/install-tests/run-ci.sh \
            scripts/ci-release-publish.ts \
            packages/browser-runtime/tsconfig.publish.json \
            packages/workspace-runtime/tsconfig.publish.json \
            .github/workflows/ci-fix-round2.yml \
            .github/scripts/apply-ci-round2.py \
            .github/scripts/apply-ci-runtime-entry-fix.py
          git commit -m "fix: publish workspace runtimes and resolve packaged server entry"
          git push origin HEAD:feat/omp-chat-workspace
