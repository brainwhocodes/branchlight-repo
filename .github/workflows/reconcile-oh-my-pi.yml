name: Reconcile Gradivus deltas onto Oh My Pi 17.3.7

on:
  push:
    branches:
      - sync/oh-my-pi-17.3.7
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'sync/oh-my-pi-17.3.7')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SHARED_BASE: 6fb07028fd61eec6a8269ce037ba354798005644
      GRADIVUS_BASE: a2f248a775e3ee225cfed5ed713ed01c72a154f8
      UPSTREAM_SHA: 565d53515b54df32fada2564d1fe9caf1a17b738
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/oh-my-pi-17.3.7
          fetch-depth: 0

      - name: Print auth-storage three-way conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          git branch -f upstream-17.3.7 FETCH_HEAD
          git diff --binary --full-index "$SHARED_BASE" "$GRADIVUS_BASE" -- packages/ai > /tmp/gradivus-ai.patch
          git checkout upstream-17.3.7 -- packages/ai
          git add -A -- packages/ai
          git apply --3way --index --whitespace=nowarn /tmp/gradivus-ai.patch || true
          echo "Conflict files:"
          git diff --name-only --diff-filter=U
          echo "auth-storage conflict markers:"
          grep -n -B 24 -A 40 '^<<<<<<<\|^=======\|^>>>>>>>' packages/ai/src/auth-storage.ts || true
          exit 1
