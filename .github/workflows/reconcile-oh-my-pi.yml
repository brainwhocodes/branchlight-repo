name: Reconcile Gradivus deltas onto Oh My Pi 17.3.7

on:
  push:
    branches: [sync/oh-my-pi-17.3.7]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'sync/oh-my-pi-17.3.7')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SHARED_BASE: 6fb07028fd61eec6a8269ce037ba354798005644
      GRADIVUS_BASE: a2f248a775e3ee225cfed5ed713ed01c72a154f8
      UPSTREAM_SHA: 565d53515b54df32fada2564d1fe9caf1a17b738
      SYNC_BRANCH: sync/oh-my-pi-17.3.7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/oh-my-pi-17.3.7
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Rebase fork deltas onto upstream implementations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          git branch -f upstream-17.3.7 FETCH_HEAD

          reconcile_path() {
            local path="$1"
            local patch="/tmp/$(printf '%s' "$path" | tr '/ ' '__').patch"
            git diff --binary --full-index "$SHARED_BASE" "$GRADIVUS_BASE" -- "$path" > "$patch"
            if git cat-file -e "upstream-17.3.7:$path" 2>/dev/null; then
              git checkout upstream-17.3.7 -- "$path"
            else
              git rm -r -f --ignore-unmatch -- "$path"
            fi
            git add -A -- "$path"
            [ ! -s "$patch" ] || git apply --3way --index --whitespace=nowarn "$patch" || true
          }

          reconcile_path packages/ai
          reconcile_path packages/coding-agent/src/main.ts
          reconcile_path packages/coding-agent/src/launch
          reconcile_path packages/coding-agent/src/mcp/transports/http.ts
          reconcile_path packages/coding-agent/src/prompts/tools/browser.md
          reconcile_path packages/coding-agent/src/prompts/tools/image-gen.md
          reconcile_path packages/coding-agent/src/sdk.ts
          reconcile_path packages/coding-agent/src/tools/image-gen.ts

          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"<<<<<<< ours\n(?P<ours>.*?)=======\n(?P<theirs>.*?)>>>>>>> theirs\n", re.DOTALL)

          def resolve(path_name, expected, resolver):
              path = Path(path_name)
              text = path.read_text()
              matches = list(pattern.finditer(text))
              if len(matches) != expected:
                  raise SystemExit(f"{path_name}: expected {expected} conflicts, found {len(matches)}")
              result, cursor = [], 0
              for index, match in enumerate(matches):
                  result.append(text[cursor:match.start()])
                  result.append(resolver(index, match.group("ours").strip("\n"), match.group("theirs").strip("\n")).rstrip("\n") + "\n")
                  cursor = match.end()
              result.append(text[cursor:])
              path.write_text("".join(result))

          resolve("packages/ai/src/auth-storage.ts", 1, lambda _i, ours, theirs: f"{theirs}\n\n{ours}")

          resolve("packages/coding-agent/src/launch/broker.ts", 1, lambda _i, _o, _t: '''\tconst requestedRestartBackoffBaseMs = options.restartBackoffBaseMs ?? RESTART_BACKOFF_BASE_MS;
          \tconst restartBackoffBaseMs =
          \t\tNumber.isFinite(requestedRestartBackoffBaseMs) && requestedRestartBackoffBaseMs >= 0
          \t\t\t? requestedRestartBackoffBaseMs
          \t\t\t: RESTART_BACKOFF_BASE_MS;
          \tawait ensureSecureRuntimeRoot(runtimeDir);
          \tconst lease = await acquireBrokerLease(runtimeDir);
          \tif (!lease) return;
          \tsetProcessName("omp daemon broker");
          \tvoid pruneDeadDaemonRuntimeDirs(runtimeDir).catch(error => {
          \t\tlogger.warn("Daemon runtime prune failed", {
          \t\t\terror: error instanceof Error ? error.message : String(error),
          \t\t});
          \t});
          \tconst token = await readControlToken(runtimeDir, TOKEN_FILE);''')

          resolve("packages/coding-agent/src/launch/presence.ts", 1, lambda _i, _o, _t: '''import {
          \tcaptureProcessIdentity,
          \tinspectProcessIdentity,
          \tisEisdir,
          \tisEnoent,
          \tlogger,
          \tpostmortem,
          } from "@oh-my-pi/pi-utils";''')

          resolve("packages/coding-agent/src/main.ts", 1, lambda _i, _o, _t: '''\tlet authStorage: AuthStorage;
          \ttry {
          \t\tauthStorage = await logger.time("discoverAuthStorage", deps.discoverAuthStorage ?? discoverAuthStorage);
          \t} catch (error) {
          \t\tconst message = await describeAuthBrokerStartupError(error);
          \t\tif (message === null) throw error;
          \t\tprocess.stderr.write(`${chalk.red(`Error: ${message}`)}\\n`);
          \t\tprocess.exit(1);
          \t}''')

          resolve("packages/coding-agent/src/mcp/transports/http.ts", 1, lambda _i, _o, _t: 'import { logger, readSseEvents, readSseJson, untilAborted } from "@oh-my-pi/pi-utils";')

          resolve("packages/coding-agent/src/prompts/tools/browser.md", 1, lambda _i, _o, _t: '''- `app.relay: true` → drive the user's own external Chrome tabs via the omp browser relay (auto-started; needs the OMP Browser Relay extension installed). `app.target` picks a tab by URL/title substring; without it the visible tab is adopted without stealing focus.
          - `close` releases the named tool session. It closes tool-owned headless pages and owned cmux surfaces, but NEVER closes pages in CDP-connected or relay browsers. Spawned-browser pages remain open unless `kill: true` terminates their process.
          - Selectors: CSS, Playwright selector engines, and `aria/…`, `text/…`, `xpath/…`, `pierce/…` namespaces are supported. Legacy `p-aria/`, `p-text/`, `p-xpath/`, and `p-pierce/` prefixes are normalized; unsupported `p-*` prefixes are rejected.''')

          resolve("packages/coding-agent/src/prompts/tools/image-gen.md", 1, lambda _i, _o, theirs: theirs)
          resolve("packages/coding-agent/src/sdk.ts", 2, lambda i, ours, theirs: f"{theirs}\n{ours}" if i == 0 else f"{ours}\n{theirs}")
          resolve("packages/coding-agent/src/tools/image-gen.ts", 1, lambda _i, _o, _t: '''\t\theaders.set("User-Agent", USER_AGENT);
          \t\tif (stream) headers.set("Accept", "text/event-stream");''')

          snap_path = Path("packages/coding-agent/test/agent-session-snapcompact-budget.test.ts")
          snap = snap_path.read_text()
          snap = snap.replace('import { encodeRpcFrame, MAX_RPC_FRAME_BYTES } from "@oh-my-pi/pi-coding-agent/modes/rpc/rpc-frame";\n', '')
          snap = snap.replace('it("keeps the frame archive out of the RPC result after persisting it", async () => {', 'it("keeps the frame archive out of the compact result after persisting it", async () => {')
          snap = snap.replace('data: "A".repeat(MAX_RPC_FRAME_BYTES),', 'data: "A".repeat(64 * 1024),')
          snap = snap.replace('''\t\tconst response = JSON.parse(
          \t\t\tencodeRpcFrame({ id: "c1", type: "response", command: "compact", success: true, data: result }),
          \t\t) as { success: boolean; error?: string };

          \t\texpect(response).toMatchObject({ success: true });
          ''', '')
          snap_path.write_text(snap)

          cli_path = Path("packages/coding-agent/test/cli-max-time-flag.test.ts")
          cli = cli_path.read_text()
          path_import = 'import * as path from "node:path";\n'
          if path_import not in cli:
              marker = 'import { describe, expect, it, vi } from "bun:test";\n'
              if marker not in cli:
                  raise SystemExit("bun:test import marker missing from cli-max-time test")
              cli = cli.replace(marker, marker + path_import, 1)
          cli_path.write_text(cli)
          PY

          git add packages/ai packages/coding-agent/src/main.ts packages/coding-agent/src/launch \
            packages/coding-agent/src/mcp/transports/http.ts packages/coding-agent/src/prompts/tools/browser.md \
            packages/coding-agent/src/prompts/tools/image-gen.md packages/coding-agent/src/sdk.ts \
            packages/coding-agent/src/tools/image-gen.ts packages/coding-agent/test/agent-session-snapcompact-budget.test.ts \
            packages/coding-agent/test/cli-max-time-flag.test.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Validate reconciled TypeScript and desktop workspace
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run ci:check:full
          bun --cwd=packages/desktop run check
          bun --cwd=packages/desktop run test

      - name: Commit reconciled port
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-oh-my-pi.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(sync): reconcile Gradivus integrations with Oh My Pi 17.3.7"
          git push origin "HEAD:${SYNC_BRANCH}"
