name: Bootstrap Oh My Pi upstream sync

on:
  push:
    branches:
      - sync/oh-my-pi-17.3.7
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'sync/oh-my-pi-17.3.7')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BASE_SHA: a2f248a775e3ee225cfed5ed713ed01c72a154f8
      UPSTREAM_SHA: 565d53515b54df32fada2564d1fe9caf1a17b738
      UPSTREAM_VERSION: 17.3.7
      SYNC_BRANCH: sync/oh-my-pi-17.3.7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/oh-my-pi-17.3.7
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Merge upstream and preserve Gradivus integration points
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          git branch -f upstream-main FETCH_HEAD

          set +e
          git merge --no-commit --no-ff upstream-main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts; preserving Gradivus on overlap and accepting all clean upstream changes."
          fi

          git diff --name-only --diff-filter=U | tee /tmp/upstream-conflicts.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done < /tmp/upstream-conflicts.txt

          preserve_paths=(
            README.md
            .github/workflows/ci.yml
            packages/desktop
            packages/browser-relay
            packages/browser-runtime
            packages/workspace-runtime
            packages/grpc
            packages/wire
            go/omp-rpc
            python/omp-rpc
            packages/coding-agent/src/desktop-terminal
            packages/coding-agent/src/modes/rpc
            packages/coding-agent/src/tools/browser
            packages/coding-agent/src/tools/browser.ts
            packages/coding-agent/src/launch
          )
          for path in "${preserve_paths[@]}"; do
            if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$path"
            fi
          done

          if git cat-file -e "$BASE_SHA:patches" 2>/dev/null; then
            git checkout "$BASE_SHA" -- patches
          fi
          if git cat-file -e "upstream-main:patches" 2>/dev/null; then
            git checkout upstream-main -- patches
          fi

          if git cat-file -e "upstream-main:MODULE.bazel.lock" 2>/dev/null; then
            git checkout upstream-main -- MODULE.bazel.lock
          fi

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Merge package manifests and regenerate Bun lockfile
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/merge-manifests.ts <<'BUN'
          import { $ } from "bun";

          const base = process.env.BASE_SHA!;
          const upstream = "upstream-main";
          const isObject = (value: unknown): value is Record<string, unknown> =>
            Boolean(value) && typeof value === "object" && !Array.isArray(value);

          function mergeValues(ours: unknown, theirs: unknown): unknown {
            if (Array.isArray(ours) && Array.isArray(theirs)) {
              const seen = new Set<string>();
              const merged: unknown[] = [];
              for (const value of [...ours, ...theirs]) {
                const key = JSON.stringify(value);
                if (!seen.has(key)) {
                  seen.add(key);
                  merged.push(value);
                }
              }
              return merged;
            }
            if (isObject(ours) && isObject(theirs)) {
              const result: Record<string, unknown> = { ...ours };
              for (const [key, value] of Object.entries(theirs)) {
                result[key] = key in result ? mergeValues(result[key], value) : value;
              }
              return result;
            }
            return theirs === undefined ? ours : theirs;
          }

          async function showJson(ref: string, path: string): Promise<Record<string, unknown> | undefined> {
            const result = Bun.spawnSync(["git", "show", `${ref}:${path}`], { stdout: "pipe", stderr: "ignore" });
            if (result.exitCode !== 0) return undefined;
            return JSON.parse(result.stdout.toString()) as Record<string, unknown>;
          }

          const listing = await $`git ls-tree -r --name-only ${base}`.text();
          const paths = listing.split("\n").filter(path => path === "package.json" || path.endsWith("/package.json"));
          const mapFields = ["scripts", "dependencies", "devDependencies", "peerDependencies", "optionalDependencies", "peerDependenciesMeta", "patchedDependencies", "overrides"];

          for (const path of paths) {
            const ours = await showJson(base, path);
            const theirs = await showJson(upstream, path);
            if (!ours || !theirs) continue;
            const merged = mergeValues(ours, theirs) as Record<string, unknown>;
            for (const field of mapFields) {
              const oursMap = isObject(ours[field]) ? ours[field] as Record<string, unknown> : {};
              const theirsMap = isObject(theirs[field]) ? theirs[field] as Record<string, unknown> : {};
              if (Object.keys(oursMap).length || Object.keys(theirsMap).length) merged[field] = { ...oursMap, ...theirsMap };
            }
            if (path === "package.json") {
              const oursWorkspaces = isObject(ours.workspaces) ? ours.workspaces : {};
              const upstreamWorkspaces = isObject(theirs.workspaces) ? theirs.workspaces : {};
              const workspaces = mergeValues(oursWorkspaces, upstreamWorkspaces) as Record<string, unknown>;
              const oursPackages = Array.isArray(oursWorkspaces.packages) ? oursWorkspaces.packages : [];
              const upstreamPackages = Array.isArray(upstreamWorkspaces.packages) ? upstreamWorkspaces.packages : [];
              workspaces.packages = [...new Set([...oursPackages, ...upstreamPackages])];
              workspaces.catalog = {
                ...(isObject(oursWorkspaces.catalog) ? oursWorkspaces.catalog : {}),
                ...(isObject(upstreamWorkspaces.catalog) ? upstreamWorkspaces.catalog : {}),
              };
              merged.workspaces = workspaces;
            }
            await Bun.write(path, `${JSON.stringify(merged, null, 2)}\n`);
          }
          BUN

          bun /tmp/merge-manifests.ts
          if ! bun install --lockfile-only --ignore-scripts; then
            bun install --lockfile-only
          fi
          git add -A
          git diff --cached --check

      - name: Commit and publish the sync branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-oh-my-pi.yml
          git add -A
          git diff --cached --check
          git commit -m "sync: merge Oh My Pi ${UPSTREAM_VERSION}" \
            -m "Merge upstream ${UPSTREAM_SHA} while preserving Gradivus desktop, gRPC, browser-runtime, workspace-runtime, and release-policy integration points."
          git push origin "HEAD:${SYNC_BRANCH}"

      - name: Validate merged workspace
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run ci:check:full
          bun --cwd=packages/desktop run check
          bun --cwd=packages/desktop run test
