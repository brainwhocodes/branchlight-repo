name: Finalize OMP chat workspace

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Clean up, validate, and publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          omp_path = Path("packages/desktop/src/renderer/OmpChat.svelte")
          omp = omp_path.read_text()
          controls_start = omp.index("  let windowMaximized = false;")
          controls_end = omp.index("  function formatMessage", controls_start)
          omp = omp[:controls_start] + omp[controls_end:]
          head_start = omp.index("<svelte:head>")
          topbar_start = omp.index('  <header class="topbar">', head_start)
          omp = omp[:head_start] + '<div class="app-shell">\n' + omp[topbar_start:]
          omp_path.write_text(omp)

          app_path = Path("packages/desktop/src/renderer/App.svelte")
          app = app_path.read_text()
          replacements = [
              (
                  '<nav class="workspace-tabs" role="tablist" aria-label="Workspace tabs">',
                  '<div class="workspace-tabs" role="tablist" aria-label="Workspace tabs">',
              ),
              ("\t\t</nav>\n\t\t<button type=\"button\" class=\"new-browser\"", "\t\t</div>\n\t\t<button type=\"button\" class=\"new-browser\""),
              ("\t\tgrid-template-rows: auto minmax(0, 1fr);\n", ""),
              ("\t.chat-stage :global(.window-bar) { display: none; }\n", ""),
          ]
          for old, new in replacements:
              if old not in app:
                  raise SystemExit(f"App cleanup marker was not found: {old!r}")
              app = app.replace(old, new, 1)
          app_path.write_text(app)

          semantic_path = Path("packages/desktop/src/renderer/styles/_semantic.scss")
          semantic = semantic_path.read_text()
          app_shell = ".app-shell { height: 100%; display: flex; flex-direction: column; }"
          if app_shell not in semantic:
              raise SystemExit("Global app-shell rule was not found")
          semantic_path.write_text(semantic.replace(
              app_shell,
              ".app-shell { height: 100%; min-height: 0; display: flex; flex-direction: column; }",
              1,
          ))

          projection_path = Path("packages/desktop/src/shared/projection.ts")
          projection_path.write_text(
              'import type { SessionKind, TimelineFileChange, TimelineItem } from "./contracts";\n\n'
              'export function projectTimeline(kind: SessionKind, items: readonly TimelineItem[]): TimelineItem[] {\n'
              '\tif (kind === "code") return [...items];\n'
              '\treturn items.map(item => {\n'
              '\t\tif (item.kind !== "tool") return item;\n'
              '\t\treturn {\n'
              '\t\t\t...item,\n'
              '\t\t\targs: undefined,\n'
              '\t\t\tresult: undefined,\n'
              '\t\t\tdetail: item.toolName === "generate_image" ? item.detail : undefined,\n'
              '\t\t};\n'
              '\t});\n'
              '}\n\n'
              'export function changedFiles(items: readonly TimelineItem[]): TimelineFileChange[] {\n'
              '\tconst latestByPath = new Map<string, TimelineFileChange>();\n'
              '\tfor (const item of items) {\n'
              '\t\tif (item.status !== "complete" || item.isError === true || !item.files) continue;\n'
              '\t\tfor (const file of item.files) {\n'
              '\t\t\tlatestByPath.delete(file.path);\n'
              '\t\t\tlatestByPath.set(file.path, file);\n'
              '\t\t}\n'
              '\t}\n'
              '\treturn Array.from(latestByPath.values()).reverse();\n'
              '}\n'
          )

          main_path = Path("packages/desktop/src/main/main.ts")
          main = main_path.read_text()
          profile_anchor = (
              "\tconst workspaceId = document.workspaces[0]?.id ?? DEFAULT_WORKSPACE_ID;\n"
              "\tconst defaultProfiles = [\n"
          )
          profile_migration = (
              "\tconst workspaceId = document.workspaces[0]?.id ?? DEFAULT_WORKSPACE_ID;\n"
              "\tfor (const profileId of [\"profile-codex\", \"profile-claude\"] as const) {\n"
              "\t\tif (!document.agentProfiles.some(item => item.id === profileId)) continue;\n"
              "\t\tif (\n"
              "\t\t\tdocument.agents.some(item => item.profileId === profileId) ||\n"
              "\t\t\tdocument.terminals.some(item => item.profileId === profileId)\n"
              "\t\t) {\n"
              "\t\t\tcontinue;\n"
              "\t\t}\n"
              "\t\tdocument = await executeBootstrapCommand(client, {\n"
              "\t\t\tversion: 1,\n"
              "\t\t\tcommandId: `profile-retire-${profileId}`,\n"
              "\t\t\tworkspaceId,\n"
              "\t\t\texpectedRevision: document.revision,\n"
              "\t\t\tissuedAt: 1,\n"
              "\t\t\ttype: \"profile.delete\",\n"
              "\t\t\tpayload: { id: profileId },\n"
              "\t\t});\n"
              "\t}\n"
              "\tconst defaultProfiles = [\n"
          )
          if profile_anchor not in main:
              raise SystemExit("Default profile anchor was not found")
          main_path.write_text(main.replace(profile_anchor, profile_migration, 1))
          PY

          bun install --frozen-lockfile
          bun --cwd=packages/desktop run check

          set -euo pipefail
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p packages/natives/native
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/

          cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
          for (const file of process.argv.slice(2)) {
            const addon = require(file);
            if (!addon || Object.keys(addon).length === 0) {
              console.error(`addon failed to load: ${file}`);
              process.exit(1);
            }
          }
          EOF
          bun "$RUNNER_TEMP/smoke-addons.js" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-baseline.node" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-modern.node"

          bun --cwd=packages/desktop run test
          bun --cwd=packages/desktop run backend:build

          rm .github/workflows/omp-chat-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/desktop/src/main/main.ts \
            packages/desktop/src/renderer/App.svelte \
            packages/desktop/src/renderer/OmpChat.svelte \
            packages/desktop/src/renderer/styles/_semantic.scss \
            packages/desktop/src/shared/projection.ts \
            .github/workflows/omp-chat-finalize.yml
          git commit -m "fix(desktop): embed OMP chat cleanly"
          git push origin HEAD:feat/omp-chat-workspace
