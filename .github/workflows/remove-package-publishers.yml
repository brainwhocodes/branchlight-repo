name: Prepare publisher cleanup

on:
  push:
    branches:
      - feat/omp-chat-workspace
    paths:
      - .github/workflows/remove-package-publishers.yml
      - scripts/remove-package-publishers.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove npm and Homebrew publishing
        shell: bash
        run: |
          python3 scripts/remove-package-publishers.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/ci.yml
          git diff --check -- .github/workflows/ci.yml

      - name: Stage validated workflow blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp .github/workflows/ci.yml staging/ci-without-package-publishers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/ci-without-package-publishers.yml
          if git diff --cached --quiet; then
            echo "Validated workflow blob is already staged."
            exit 0
          fi
          git commit -m "chore: stage cleaned CI workflow blob"
          git push origin HEAD:feat/omp-chat-workspace
