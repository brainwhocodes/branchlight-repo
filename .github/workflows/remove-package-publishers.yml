name: Prepare publisher cleanup

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Remove npm and Homebrew publishing
        shell: bash
        run: |
          python3 scripts/remove-package-publishers.py
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/ci.yml
          git diff --check -- .github/workflows/ci.yml

      - name: Upload patched CI workflow
        uses: actions/upload-artifact@v4
        with:
          name: ci-without-package-publishers
          path: .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 1
