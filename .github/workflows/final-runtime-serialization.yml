name: Final runtime serialization

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system dependencies
        uses: ./.github/actions/setup-system-deps

      - name: Serialize runtime bucket in test runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci-test-ts.ts')
          source = path.read_text()
          old = '''\tconst pooled = requestedCommands.length > 1 && (!isCI() || explicitConcurrency);\n\t// The sequential path is a pool of one, so a lone chunk keeps the whole budget.\n\tconst poolWidth = pooled ? testConcurrency(requestedCommands.length) : 1;'''
          new = '''\t// Runtime/session chunks spawn real Bun/http2 child agents. Bun 1.3.14 can\n\t// intermittently reset loopback h2c streams when several of those chunks run\n\t// concurrently, so keep this bucket process-serial even when CI requests a\n\t// wider pool. Other buckets retain their configured fan-out.\n\tconst forceSequential = requestedMode === "coding-agent-runtime";\n\tconst pooled = !forceSequential && requestedCommands.length > 1 && (!isCI() || explicitConcurrency);\n\t// The sequential path is a pool of one, so a lone chunk keeps the whole budget.\n\tconst poolWidth = pooled ? testConcurrency(requestedCommands.length) : 1;'''
          if old not in source:
              raise SystemExit('test runner pool block not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install release native addons
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$tmp"
          mkdir -p packages/natives/native
          cp "$tmp/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$tmp/package/pi_natives.linux-x64-modern.node" packages/natives/native/

      - name: Validate runtime runner ignores four-way fan-out
        env:
          OMP_TEST_CONCURRENCY: "4"
        run: bun run ci:test:coding-agent:runtime

      - name: Publish validated runner stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci-test-ts.ts
          git commit -m "ci: serialize coding-agent runtime chunks"
          git push origin HEAD:feat/omp-chat-workspace
