name: Final RPC CI fix

on:
  push:
    branches:
      - feat/omp-chat-workspace

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system dependencies
        uses: ./.github/actions/setup-system-deps

      - name: Treat client stream abort as RPC disconnect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/grpc/src/transport.ts")
          source = path.read_text()
          old = 'stream.on("aborted", () => this.#queue.fail(new Error("gRPC stream was aborted")));'
          new = '''// A client can tear down its Connect stream with RST_STREAM instead of a clean request EOF.\n\t\t// On the server this is a normal peer disconnect: end the input queue so RPC cleanup/dispose runs.\n\t\t// Decoder/protocol failures are still surfaced through #queue.fail above.\n\t\tstream.on("aborted", () => this.#queue.end());'''
          if old not in source:
              raise SystemExit("expected ServerConnection aborted handler not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install release native addons
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$tmp"
          mkdir -p packages/natives/native
          cp "$tmp/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$tmp/package/pi_natives.linux-x64-modern.node" packages/natives/native/

      - name: Validate gRPC transport
        run: cd packages/grpc && bun test test/transport.test.ts --timeout=30000

      - name: Validate failing RPC regression
        run: cd packages/coding-agent && bun test test/rpc.test.ts --test-name-pattern "rejects enable but disable preserves Fireworks priority activity" --parallel=1 --timeout=30000

      - name: Validate coding-agent runtime bucket
        env:
          OMP_TEST_CONCURRENCY: "4"
        run: bun run ci:test:coding-agent:runtime

      - name: Publish validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-rpc-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/grpc/src/transport.ts .github/workflows/final-rpc-ci-fix.yml
          git commit -m "fix(grpc): treat client abort as RPC disconnect"
          git push origin HEAD:feat/omp-chat-workspace
