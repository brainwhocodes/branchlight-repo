name: Bootstrap Mars Kommander desktop PR

on:
  push:
    branches:
      - feat/mars-commander-desktop-builds

permissions:
  contents: write

jobs:
  build-change:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/setup-system-deps

      - name: Install Electron runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2

      - name: Apply Mars Kommander desktop changes
        shell: bash
        env:
          CHANGESET_B64: ""
        run: |
          printf '%s' "$CHANGESET_B64" | base64 --decode | tar -xz
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' .github/workflows/desktop-build.yml
          git diff --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install released Linux native addons
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$temp"
          mkdir -p packages/natives/native
          cp "$temp/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$temp/package/pi_natives.linux-x64-modern.node" packages/natives/native/

      - name: Check desktop package
        run: bun --cwd packages/desktop run check

      - name: Test desktop package
        run: bun --cwd packages/desktop run test

      - name: Package screenshot build
        run: |
          bun --cwd packages/desktop run backend:build
          bun --cwd packages/desktop run package -- --platform=linux --arch=x64

      - name: Capture real Electron screenshot
        env:
          MARS_README_SCREENSHOT: ${{ github.workspace }}/docs/assets/mars-kommander-app.png
        run: xvfb-run -a bun --cwd packages/desktop run docs:screenshot

      - name: Verify screenshot
        shell: bash
        run: |
          test -s docs/assets/mars-kommander-app.png
          dimensions="$(identify -format '%wx%h' docs/assets/mars-kommander-app.png)"
          echo "README screenshot: $dimensions"
          test "$dimensions" = "1440x900"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-mars-desktop-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            .github/workflows/desktop-build.yml \
            packages/desktop/forge.config.ts \
            packages/desktop/package.json \
            packages/desktop/scripts/build-contained.ts \
            packages/desktop/e2e/packaged.spec.ts \
            packages/desktop/e2e/readme-screenshot.spec.ts \
            packages/desktop/playwright.readme.config.ts \
            docs/assets/mars-kommander-app.png
          git add -u .github/workflows/bootstrap-mars-desktop-pr.yml
          git diff --cached --check
          git commit -m "feat(desktop): build contained Mars Kommander apps"
          git push origin HEAD:feat/mars-commander-desktop-builds
